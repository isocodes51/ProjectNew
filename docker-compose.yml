services:
  # ---- Backend: .NET 10 Web API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weather-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # API anahtarı: .env dosyasından gelir (compose yanında .env olmalı)
      WEATHERAPI_KEY: ${WEATHERAPI_KEY:-}
      ASPNETCORE_ENVIRONMENT: Production
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/weather/cities"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---- Frontend: React + nginx ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: weather-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3