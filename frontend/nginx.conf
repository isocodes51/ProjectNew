server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker yerleşik DNS — upstream çözümlemesini istek anına erteler.
    # Böylece nginx, backend henüz hazır değilse bile başlayabilir.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    # SPA routing — deep link'ler index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API isteklerini backend container'ına proxy'le
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statik asset'ler için cache
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}